<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: deep violet rounded square -->
  <rect width="512" height="512" rx="110" fill="#0a0a0f"/>
  <!-- Outer glow ring -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.4"/>
  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="url(#bgGlow)"/>
  <!-- Sparkles icon centred at 256,256 scaled to ~220px -->
  <!-- Large star centre -->
  <path d="M256 136 L271 221 L356 236 L271 251 L256 336 L241 251 L156 236 L241 221 Z"
        fill="url(#sparkGrad)" opacity="0.95"/>
  <!-- Small star top-right -->
  <path d="M338 160 L344 188 L372 194 L344 200 L338 228 L332 200 L304 194 L332 188 Z"
        fill="#a78bfa" opacity="0.75" transform="scale(0.68) translate(140, 58)"/>
  <!-- Small star bottom-left -->
  <path d="M178 284 L182 302 L200 306 L182 310 L178 328 L174 310 L156 306 L174 302 Z"
        fill="#c4b5fd" opacity="0.65"/>
</svg>
